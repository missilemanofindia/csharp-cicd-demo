name: .NET Framework CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore WebApplication2/WebApplication2.sln

    - name: Build Application
      run: msbuild WebApplication2/WebApplication2.sln /p:Configuration=Release /p:DeployOnBuild=true

    - name: Publish Application
      run: msbuild WebApplication2/WebApplication2.sln /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:publishUrl="${{ github.workspace }}\publish"

    - name: Zip Output Folder
      run: Powershell Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\app.zip" -Force

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'amit-csharp-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ github.workspace }}\app.zip'