name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore NuGet Packages
      run: dotnet restore MyAppsolution.slnx

    - name: Build Application
      run: dotnet build MyAppsolution.slnx --no-restore --configuration Release

    - name: Execute Tests
      run: dotnet test MyAppsolution.slnx --no-build --configuration Release
