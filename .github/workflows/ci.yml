name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore NuGet Packages
      run: dotnet restore MyAppsolution.slnx

    - name: Build Application
      run: dotnet build WebApplication2/WebApplication2.sln --no-restore --configuration Release

    - name: Execute Tests
      run: dotnet test WebApplication2/WebApplication2.sln --no-build --configuration Release

    - name: Publish Calculator Application
      run: dotnet publish WebApplication2 -c Release -o ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'amit-csharp-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

